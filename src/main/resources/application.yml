spring:
  config:
    import: optional:file:.env[.properties]   # 프로젝트 루트 .env 를 설정으로 로드 (값은 팀에서 Notion 공유)
  application:
    name: Welcomekit_BE
  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/welcomekit
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        show_sql: true
    hibernate:
      ddl-auto: update

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}               # 이메일 인증 테스트 안 하면 비워도 앱은 뜸
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION:ap-northeast-2}
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}

app:
  signup:
    email-domain: ${SIGNUP_EMAIL_DOMAIN:}
    admin-invite-code: ${ADMIN_INVITE_CODE:}
    code-ttl-minutes: ${SIGNUP_CODE_TTL_MINUTES:10}
  attendance:
    qr-base-url: ${ATTENDANCE_QR_BASE_URL:http://localhost:8080/api/v3/welcome-kit/attendance/success}

logging.level:
  org.hibernate.SQL: debug

springdoc:
  swagger-ui:
    path: swagger
    try-it-out-enabled: true
    filter: true
    operations-sorter: method
    display-request-duration: true
