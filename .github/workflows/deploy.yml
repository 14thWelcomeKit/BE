name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: false  # 서브모듈 제거

      # 0. 필수 시크릿 누락 여부 사전 체크
      - name: verify required secrets are set
        run: |
          missing=()
          [ -z "${{ secrets.APPLICATION_YML }}" ] && missing+=("APPLICATION_YML")
          [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] && missing+=("DOCKERHUB_USERNAME")
          [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ] && missing+=("DOCKERHUB_TOKEN")
          [ -z "${{ secrets.EC2_HOST }}" ] && missing+=("EC2_HOST")
          [ -z "${{ secrets.EC2_USERNAME }}" ] && missing+=("EC2_USERNAME")
          [ -z "${{ secrets.EC2_SSH_KEY }}" ] && missing+=("EC2_SSH_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "다음 Secret이 등록돼있지 않습니다: ${missing[*]}"
            exit 1
          fi

      # 1. Java 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      # 2. application.yml 생성
      - name: create application.yml file
        run: |
          touch ./src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_YML }}" > src/main/resources/application.yml

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. Spring Boot 애플리케이션 빌드
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: clean bootJar

      # 5. Docker 이미지 빌드
      - name: docker image build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/welcomekit_be .

      # 6. DockerHub 로그인
      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Docker Hub 이미지 푸시
      - name: docker Hub push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/welcomekit_be

  run-docker-image-on-ec2:
    needs: build-docker-image
    runs-on: ubuntu-latest

    steps:
      - name: deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/welcomekit_be
            sudo docker rm -f welcomekit_be || true
            sudo docker run -v /home/ubuntu/profile:/app/external-profile --name welcomekit_be --rm -d --network host ${{ secrets.DOCKERHUB_USERNAME }}/welcomekit_be
            sudo docker system prune -f