name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: false  # 서브모듈 제거

      # 0. 필수 시크릿 누락 여부 사전 체크
      - name: verify required secrets are set
        run: |
          missing=()
          [ -z "${{ secrets.MYSQL_ROOT_PASSWORD }}" ] && missing+=("MYSQL_ROOT_PASSWORD")
          [ -z "${{ secrets.JWT_SECRET }}" ] && missing+=("JWT_SECRET")
          [ -z "${{ secrets.MAIL_USERNAME }}" ] && missing+=("MAIL_USERNAME")
          [ -z "${{ secrets.MAIL_PASSWORD }}" ] && missing+=("MAIL_PASSWORD")
          [ -z "${{ secrets.ATTENDANCE_QR_BASE_URL }}" ] && missing+=("ATTENDANCE_QR_BASE_URL")
          [ -z "${{ secrets.AWS_S3_BUCKET }}" ] && missing+=("AWS_S3_BUCKET")
          [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && missing+=("AWS_ACCESS_KEY_ID")
          [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && missing+=("AWS_SECRET_ACCESS_KEY")
          [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] && missing+=("DOCKERHUB_USERNAME")
          [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ] && missing+=("DOCKERHUB_TOKEN")
          [ -z "${{ secrets.EC2_HOST }}" ] && missing+=("EC2_HOST")
          [ -z "${{ secrets.EC2_USERNAME }}" ] && missing+=("EC2_USERNAME")
          [ -z "${{ secrets.EC2_SSH_KEY }}" ] && missing+=("EC2_SSH_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "다음 Secret이 등록돼있지 않습니다: ${missing[*]}"
            exit 1
          fi

      # 1. Java 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      # application.yml 은 이제 git 에 커밋된 placeholder 버전을 그대로 빌드에 씀.
      # 실제 값은 EC2에서 docker run 시 환경변수로 주입 (아래 run-docker-image-on-ec2 참고).

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 2. Spring Boot 애플리케이션 빌드
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: clean bootJar

      # 3. Docker 이미지 빌드
      - name: docker image build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/welcomekit_be .

      # 4. DockerHub 로그인
      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Docker Hub 이미지 푸시
      - name: docker Hub push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/welcomekit_be

  run-docker-image-on-ec2:
    needs: build-docker-image
    runs-on: ubuntu-latest

    steps:
      - name: deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SIGNUP_EMAIL_DOMAIN: ${{ secrets.SIGNUP_EMAIL_DOMAIN }}
          ADMIN_INVITE_CODE: ${{ secrets.ADMIN_INVITE_CODE }}
          ATTENDANCE_QR_BASE_URL: ${{ secrets.ATTENDANCE_QR_BASE_URL }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MYSQL_ROOT_PASSWORD,JWT_SECRET,MAIL_USERNAME,MAIL_PASSWORD,SIGNUP_EMAIL_DOMAIN,ADMIN_INVITE_CODE,ATTENDANCE_QR_BASE_URL,AWS_S3_BUCKET,AWS_S3_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/welcomekit_be
            sudo docker rm -f welcomekit_be || true
            sudo docker run -v /home/ubuntu/profile:/app/external-profile \
              --name welcomekit_be --rm -d --network host \
              -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e MAIL_USERNAME="$MAIL_USERNAME" \
              -e MAIL_PASSWORD="$MAIL_PASSWORD" \
              -e SIGNUP_EMAIL_DOMAIN="$SIGNUP_EMAIL_DOMAIN" \
              -e ADMIN_INVITE_CODE="$ADMIN_INVITE_CODE" \
              -e ATTENDANCE_QR_BASE_URL="$ATTENDANCE_QR_BASE_URL" \
              -e AWS_S3_BUCKET="$AWS_S3_BUCKET" \
              -e AWS_S3_REGION="$AWS_S3_REGION" \
              -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
              ${{ secrets.DOCKERHUB_USERNAME }}/welcomekit_be
            sudo docker system prune -f
